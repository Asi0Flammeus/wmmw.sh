services:
  wmmw-sylva:
    image: wmmw-sylva:preview
    container_name: wmmw-sylva
    build:
      context: .
      args:
        # QA annotation overlay (Alt+Y) enabled for this preview only.
        ANNOTATION_SYSTEM: "true"
    ports:
      # host 4350 -> container 4321. Cloudron proxy app points wmmw.crqpt.com here.
      - "4350:4321"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
      - ANNOTATION_SYSTEM=true
    volumes:
      # annotation comments land here as JSONL, readable from the host
      - ./.prototype-feedback:/app/.prototype-feedback
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4321/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
