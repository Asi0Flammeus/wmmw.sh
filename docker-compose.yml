services:
  wmmw:
    image: ${IMAGE_REF:-wmmw:local}
    container_name: wmmw
    build:
      context: .
    ports:
      # host 4327 -> container 4321 (4321-4326 already taken; wmmw uses 4327)
      - "4327:4321"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4321/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
