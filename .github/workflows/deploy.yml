name: Deploy

# Redeploy on the crqpt server after CI passes on main (i.e. every PR merge to
# main). Also runnable on demand via the Actions tab.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to crqpt
    runs-on: ubuntu-latest
    # Only when triggered manually, or when the CI run it follows succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: SSH -> ./deploy.sh update
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          command_timeout: 15m
          script_stop: true
          script: |
            cd ~/repos/Asi0Flammeus/wmmw.sh
            ./deploy.sh update
