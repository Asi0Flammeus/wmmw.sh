<!doctype html>
<!--
  OG card source (spec §5.5): 1200 x 630, Lycurgus light. Rendered per locale by
  scripts/og-render.py, which fills {{LINE}}, {{LANG}} and {{MONOGRAM}} (the line
  monogram, M tinted ruby) and writes public/og/default-<locale>.png.
-->
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Basteleur"; src: url("../../../public/fonts/basteleur-moonlight.woff2") format("woff2"); }
  @font-face { font-family: "Schibsted"; src: url("../../../node_modules/@fontsource-variable/schibsted-grotesk/files/schibsted-grotesk-latin-wght-normal.woff2") format("woff2"); font-weight: 400 900; }
  @font-face { font-family: "JBM"; src: url("../../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); font-weight: 100 800; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #ecf2f0; color: #1c2c29; position: relative; overflow: hidden; }
  /* faint static ring field behind the monogram only: fringe #33705f at .08, never under the text */
  .field {
    position: absolute; left: 640px; top: 0; width: 560px; height: 630px;
    background: repeating-radial-gradient(circle at 340px 315px, #33705f 0 1.5px, transparent 2.5px 6px);
    opacity: .08;
    -webkit-mask: radial-gradient(circle at 340px 315px, #000 0 210px, transparent 300px);
  }
  .mono { position: absolute; right: 40px; top: 135px; width: 360px; height: 360px; --mono-a: #1c2c29; --mono-s: #1c2c29; --mono-b: #ad335b; }
  .mono svg { width: 360px; height: 360px; display: block; }
  .name { position: absolute; left: 80px; top: 196px; margin: 0; font: 400 112px/1.1 "Basteleur"; font-feature-settings: "ss01"; letter-spacing: -.01em; white-space: nowrap; }
  .line { position: absolute; left: 82px; top: 352px; margin: 0; max-width: 560px; font: 400 36px/1.3 "Schibsted"; color: #414f4b; }
  .site { position: absolute; left: 82px; bottom: 64px; margin: 0; font: 400 24px/1 "JBM"; color: #586361; letter-spacing: .01em; }
</style>
</head>
<body>
  <div class="field"></div>
  <div class="mono">{{MONOGRAM}}</div>
  <p class="name">William Moiré</p>
  <p class="line">{{LINE}}</p>
  <p class="site">wmmw.sh</p>
</body>
</html>
