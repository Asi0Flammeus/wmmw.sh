# William Moiré redesign preview (branch feat/william-moire).
# Served at https://moire.wmmw.sh by a hand-managed nginx vhost
# (/etc/nginx/applications/moire.wmmw.sh.conf) -> 127.0.0.1:4378
# (`port-claim wmmw-moire`). Own compose project name so it never touches the
# production `wmmw` service that lives in the same checkout.
#
#   INTAKE_SECRET and INTAKE_TOKEN come from .env.moire (never committed):
#   docker compose -f docker-compose.moire.yml --env-file .env.moire up -d --build
name: wmmw-moire

services:
  wmmw-moire:
    image: wmmw-moire:preview
    container_name: wmmw-moire
    build:
      context: .
      args:
        # QA annotation overlay (Alt+Y) is the point of this preview.
        - ANNOTATION_SYSTEM=true
    # the host's address pools are exhausted: join the default bridge, create no network
    network_mode: bridge
    ports:
      - "127.0.0.1:4378:4321"
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=4321
      - REPORTS_DIR=/data/reports
      - INTAKE_DIR=/data/intake
      - INTAKE_TOKEN=${INTAKE_TOKEN:-}
      # required (critique E8): a stable key keeps open forms valid across redeploys
      - INTAKE_SECRET=${INTAKE_SECRET:?set INTAKE_SECRET in .env.moire}
      - INTAKE_ALLOWED_ORIGINS=https://moire.wmmw.sh
    volumes:
      - moire-reports:/data/reports
      - moire-intake:/data/intake
      - moire-feedback:/app/.prototype-feedback
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4321/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  moire-reports:
  moire-intake:
  moire-feedback:
